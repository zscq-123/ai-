spring:
  application:
    name: commerce-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:55432/commerce}
    username: ${POSTGRES_USER:commerce}
    password: ${POSTGRES_PASSWORD:commerce_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:56379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:commerce}
    password: ${RABBITMQ_PASSWORD:commerce_local}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8081/realms/commerce/protocol/openid-connect/certs}

server:
  port: ${COMMERCE_API_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-},spanId=%X{spanId:-}]"

integrations:
  bright-data:
    api-key: ${BRIGHT_DATA_API_KEY:}
    base-url: ${BRIGHT_DATA_BASE_URL:https://api.brightdata.com}
    lazada-dataset-id: ${BRIGHT_DATA_LAZADA_DATASET_ID:gd_m6gjtfmeh43we6cqc}
    poll-attempts: ${BRIGHT_DATA_POLL_ATTEMPTS:20}
    poll-interval: ${BRIGHT_DATA_POLL_INTERVAL:PT3S}

commerce:
  security:
    local-admin-public: ${LOCAL_ADMIN_PUBLIC:false}
  payment:
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:local-payment-secret}
