[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "commerce-ai-service"
version = "0.1.0"
description = "AI customer service for the enterprise commerce platform"
requires-python = ">=3.13,<3.15"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.118,<1",
  "fastembed>=0.9,<1",
  "httpx>=0.28,<1",
  "pgvector>=0.4,<1",
  "prometheus-client>=0.23,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.11,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.37,<1"
]

[project.optional-dependencies]
dev = [
  "mypy>=1.18,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.14,<1",
  "testcontainers[postgres]>=4.13,<5"
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_service"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["ai_service"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
