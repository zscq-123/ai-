limit_req_zone $binary_remote_addr zone=support_chat:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=support_login:10m rate=10r/m;
server_tokens off;
proxy_connect_timeout 5s;
proxy_read_timeout 90s;
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
client_max_body_size 20m;
ssl_certificate /etc/letsencrypt/live/nova-ip/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/nova-ip/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;

server {
    listen 8443 ssl;
    server_name 154.36.185.110;
    location = /api/v1/chat/messages {
        limit_req zone=support_chat burst=8 nodelay;
        limit_req_status 429;
        proxy_pass http://buzud-api:8090;
    }
    location = /api/admin/auth/login/ {
        limit_req zone=support_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://buzud-web:3000;
    }
    location /api/v1/ { proxy_pass http://buzud-api:8090; }
    location ~* ^/(actuator|swagger|v3/api-docs|\.env) { return 404; }
    location / { proxy_pass http://buzud-web:3000; }
}

server {
    listen 8444 ssl;
    server_name 154.36.185.110;
    root /srv/oms;
    index index.html;
    proxy_set_header X-User-Id "";
    proxy_set_header X-Username "";
    proxy_set_header X-User-Type "";
    proxy_set_header X-Merchant-Id "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    location = /api/v1/auth/login {
        limit_req zone=support_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://oms-gateway:8080;
    }
    location = /api/v1/support/chat {
        limit_req zone=support_chat burst=8 nodelay;
        limit_req_status 429;
        proxy_pass http://oms-gateway:8080;
    }
    location ~* (/internal(?:/|$)|/actuator|/v3/api-docs|/swagger|^/\.env) { return 404; }
    location /api/ { proxy_pass http://oms-gateway:8080; }
    location / { try_files $uri $uri/ /index.html; }
}
