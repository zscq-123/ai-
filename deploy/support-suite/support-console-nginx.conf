server_tokens off;
limit_req_zone $binary_remote_addr zone=support_console_api:1m rate=5r/s;

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    auth_basic "NOVA AI Support Console";
    auth_basic_user_file /etc/nginx/.htpasswd;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data: https://154.36.185.46:18083; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    location = /healthz {
        auth_basic off;
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location /api/ai/ {
        limit_req zone=support_console_api burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 12m;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_http_version 1.1;
        proxy_set_header Host support-ai;
        proxy_set_header Authorization "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://support-ai:8000/;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
